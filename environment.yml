name: mvmem
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy=2.2
  - scipy=1.15
  - pandas=2.3
  - scikit-learn=1.7
  - statsmodels=0.14
  - matplotlib=3.10
  - seaborn=0.13
  - openpyxl                    # reading the similarity-benchmark workbook (1_generate/ann_features.py --benchmark)
  - mne=1.8
  - mne-bids=0.16
  - pip
  # decoding.py / rsa.py also need mvEEG (https://github.com/AwhVogelLab/mvEEG); see README
  # only for 1_generate/ann_features.py (ANN feature extraction):
  # - pip:
  #     - torch
  #     - thingsvision
  #     - resmem
